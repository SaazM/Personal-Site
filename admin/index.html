<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — saazm.dev</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..600&display=swap">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body.admin {
      max-width: 44rem;
      padding-top: 1.5rem;
    }
    .top {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--hairline);
    }
    .top h1 {
      font-size: 1.5rem;
    }
    .top-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
    #status {
      color: var(--muted);
      font-size: 0.875rem;
      min-width: 6rem;
    }
    #status.ok { color: var(--accent); }
    #status.err { color: #8b2e1a; }
    button, .btn {
      font: inherit;
      font-size: 0.875rem;
      color: var(--muted);
      background: none;
      border: 1px solid var(--hairline);
      border-radius: 6px;
      padding: 0.35rem 0.8rem;
      cursor: pointer;
    }
    button:hover, .btn:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    button.primary {
      color: var(--ink);
      border-color: var(--ink);
    }
    button.primary:hover {
      color: var(--accent);
      border-color: var(--accent);
    }
    button.danger:hover {
      color: #8b2e1a;
      border-color: #8b2e1a;
    }
    .section-block {
      margin-bottom: 2.5rem;
    }
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.75rem;
    }
    .section-head h2 {
      margin: 0;
      padding: 0;
      border: none;
    }
    .card {
      border: 1px solid var(--hairline);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.75rem;
      background: color-mix(in srgb, var(--paper) 92%, var(--hairline));
    }
    .card.dragging {
      opacity: 0.45;
    }
    .card.drag-over {
      border-color: var(--accent);
    }
    .card-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }
    .handle {
      cursor: grab;
      color: var(--muted);
      user-select: none;
      font-size: 1rem;
      letter-spacing: 0.05em;
      padding: 0.15rem 0.35rem;
    }
    .handle:active { cursor: grabbing; }
    .card-bar .spacer { flex: 1; }
    label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0.55rem 0 0.2rem;
    }
    label:first-of-type { margin-top: 0; }
    input[type="text"], textarea {
      width: 100%;
      font: inherit;
      font-size: 0.9375rem;
      color: var(--ink);
      background: var(--paper);
      border: 1px solid var(--hairline);
      border-radius: 4px;
      padding: 0.4rem 0.5rem;
    }
    input[type="text"]:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    textarea {
      min-height: 5.5rem;
      resize: vertical;
      line-height: 1.45;
    }
    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem 0.75rem;
    }
    @media (max-width: 560px) {
      .row2 { grid-template-columns: 1fr; }
    }
    .hint {
      color: var(--muted);
      font-size: 0.8125rem;
      margin: 0 0 1rem;
    }
  </style>
</head>
<body class="admin">

<div class="top">
  <div>
    <a class="back" href="../">← Back to home</a>
    <h1>Edit homepage</h1>
  </div>
  <div class="top-actions">
    <span id="status" aria-live="polite"></span>
    <button type="button" class="primary" id="save">Save</button>
  </div>
</div>

<p class="hint">Local only — Save writes <code>content/site.json</code> and regenerates the homepage. Drag the handle to reorder.</p>

<div id="app">Loading…</div>

<script src="admin.js?v=3" defer></script>
<script>
  // If the main script never finishes load(), surface a useful recovery path.
  setTimeout(function () {
    var app = document.getElementById("app");
    var status = document.getElementById("status");
    if (app && app.textContent.trim() === "Loading…") {
      status.textContent = "load stalled";
      status.className = "err";
      app.innerHTML =
        'Load stalled. Confirm <a href="/content/site.json">/content/site.json</a> opens, ' +
        'then hard-refresh (Cmd+Shift+R). Use <a href="http://localhost:3000/admin/">localhost:3000/admin/</a> — not a file:// URL.';
    }
  }, 6000);
</script>
</body>
</html>
